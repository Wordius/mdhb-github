title = "The Markdown Handbook"

description = "The Markdown Handbook is your reference to everything markdown."

base_url = "https://md-handbook.com"

author = "The Markdown Handbook"

default_language = "en"

# SASS

compile_sass = false

# TAXONOMIES

taxonomies = [
    { name = "tags", paginate_by = 10, feed = true },
]

# FEEDS

generate_feeds = true
feed_filenames = ["rss.xml"]

# SEARCH INDEX

build_search_index = true

[search]
index_format = "elasticlunr_javascript" # or "elasticlunr_json"

# MARKDOWN

[markdown]
highlight_code = true
highlight_theme = "base16-ocean-light" # kronuz

# MARKDOWN HIGHLIGHTING

[markdown.highlighting]
# When set to "true", missing highlight languages are treated as errors. Defaults to false but recommended to set to true.
error_on_missing_language = false

# Whether to use inline hex colours (`inline`) or CSS classes (`class`) 
style = "inline"

# Selecting a theme is always required: you have a choice between single (1) or dual themes (2).
# Only outputting CSS classes like before 0.22 is not possible anymore.
# 1. If you use a single theme, put its name here. See the syntax highlighting page for the possible choices.
theme = ""

# 2. If you want light/dark themes, use the 2 fields below instead. See the syntax highlighting page for the possible choices.
light_theme = ""
dark_theme = ""

# A list of files for additional JSON TextMate grammars
extra_grammars = ["css", "html", "json"]

[extra]

[extra.term_descriptions]
plugins = "A directory of Obsidian plugins, extensions for VS Code and add-ons for other apps. Most, but not all, are aimed at writers"
